```yaml
services:
  - type: web
    name: yamaha-bot-1
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    autoDeploy: true

    envVars:

      # ==========================================
      # PYTHON
      # ==========================================
      - key: PYTHON_VERSION
        value: 3.11.9

      # ==========================================
      # URL BOT
      # ==========================================
      - key: BASE_URL
        value: https://yamaha-bot-1.onrender.com

      # ==========================================
      # DATABASE
      # ==========================================
      - key: DATABASE_URL
        fromDatabase:
          name: yamaha-postgres
          property: connectionString

      # ==========================================
      # Z-API
      # ==========================================
      - key: ZAPI_INSTANCE_ID
        sync: false

      - key: ZAPI_TOKEN
        sync: false

      - key: ZAPI_CLIENT_TOKEN
        sync: false

      # ==========================================
      # OPENAI
      # ==========================================
      - key: OPENAI_API_KEY
        sync: false

      # ==========================================
      # INATIVIDADE
      # ==========================================
      - key: TEMPO_INATIVIDADE
        value: 600

      # ==========================================
      # FOLLOW-UP
      # ==========================================
      - key: INTERVALO_WORKER_FOLLOWUP
        value: 300

      - key: FOLLOWUP_1_HORAS
        value: 48

      - key: FOLLOWUP_2_DIAS
        value: 5

      # ==========================================
      # WORKERS
      # ==========================================
      - key: INTERVALO_WORKER
        value: 30

      - key: INTERVALO_WORKER_SANCES
        value: 60

      # ==========================================
      # SANCES
      # ==========================================
      - key: SANCES_MODO
        value: mock

      - key: SANCES_TIMEOUT
        value: 30

      - key: SANCES_RETRY_MAX
        value: 3

      # ==========================================
      # GUNICORN
      # ==========================================
      - key: WEB_CONCURRENCY
        value: 1

      # ==========================================
      # LOG
      # ==========================================
      - key: PYTHONUNBUFFERED
        value: true
        
      # ==========================================
      # IA / BASE DE CONHECIMENTO
      # ==========================================
      - key: CAMINHO_MANUAIS
        value: manuais

      - key: CAMINHO_PLANILHA_REVISOES
        value: templates/data/revisoes_yamaha.xlsx

      - key: IA_ATIVA
        value: true