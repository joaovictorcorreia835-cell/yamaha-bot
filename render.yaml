```yaml
services:
  - type: web
    name: yamaha-bot-1
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --timeout 120 --workers 1 --threads 2

    autoDeploy: true

    envVars:

      # ==========================================
      # PYTHON
      # ==========================================
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: PYTHONUNBUFFERED
        value: true

      # ==========================================
      # BASE URL
      # ==========================================
      - key: BASE_URL
        value: https://yamaha-bot-1.onrender.com

      # ==========================================
      # DATABASE
      # ==========================================
      - key: DATABASE_URL
        fromDatabase:
          name: yamaha-postgres
          property: connectionString

      # ==========================================
      # Z-API
      # ==========================================
      - key: ZAPI_INSTANCE_ID
        sync: false

      - key: ZAPI_TOKEN
        sync: false

      - key: ZAPI_CLIENT_TOKEN
        sync: false

      # ==========================================
      # OPENAI
      # ==========================================
      - key: OPENAI_API_KEY
        sync: false

      # ==========================================
      # IA
      # ==========================================
      - key: IA_ATIVA
        value: true

      - key: IA_COMERCIAL_ATIVA
        value: true

      - key: IA_DUVIDAS_ATIVA
        value: true

      # ==========================================
      # MANUAIS / PDF
      # ==========================================
      - key: CAMINHO_MANUAIS
        value: templates/data/manuais

      - key: CAMINHO_PLANILHA_REVISOES
        value: templates/data/revisoes_yamaha.xlsx

      # ==========================================
      # INATIVIDADE
      # ==========================================
      - key: TEMPO_INATIVIDADE
        value: 600

      # ==========================================
      # FOLLOW-UP
      # ==========================================
      - key: INTERVALO_WORKER_FOLLOWUP
        value: 300

      - key: FOLLOWUP_1_HORAS
        value: 48

      - key: FOLLOWUP_2_DIAS
        value: 5

      # ==========================================
      # WORKERS
      # ==========================================
      - key: INTERVALO_WORKER
        value: 30

      - key: INTERVALO_WORKER_SANCES
        value: 60

      - key: WORKER_ATIVO
        value: true

      # ==========================================
      # SANCES
      # ==========================================
      - key: SANCES_TIMEOUT
        value: 30

      - key: SANCES_RETRY_MAX
        value: 3

      - key: SANCES_EMPRESA
        value: 1

      - key: SANCES_CONSULTOR
        value: 52423

      - key: SANCES_MIDIA
        value: 0

      - key: SANCES_ASSUNTO
        value: 10006

      - key: SANCES_URL
        value: https://api.sancesturbo.com.br/integracao/oficina/agendar

      - key: SANCES_API_URL
        value: https://api.sancesturbo.com.br/integracao/posVenda

      - key: SANCES_POS_VENDA_URL
        value: https://api.sancesturbo.com.br/integracao/posVenda

      - key: SANCES_LIMIT
        value: 20

      - key: SANCES_OFFSET
        value: 4

      - key: SANCES_CLIENTES_URL
        value: https://api.sancesturbo.com.br/integracao/cadastros/clientes

      - key: SANCES_VEICULOS_URL
        value: https://api.sancesturbo.com.br/integracao/veiculos

      - key: SANCES_ESTOQUE_URL
        value: https://api.sancesturbo.com.br/integracao/estoque

      - key: SANCES_ESTOQUE_LIMIT
        value: 20

      - key: SANCES_ESTOQUE_OFFSET
        value: 0

      - key: SANCES_ESTOQUE_ATIVO
        value: 1

      - key: SANCES_NEGOCIACAO_URL
        value: https://api.sancesturbo.com.br/integracao/veiculos/getNegociacao

      - key: SANCES_GET_VENDAS_URL
        value: https://api.sancesturbo.com.br/integracao/vendas

      # ==========================================
      # GUNICORN
      # ==========================================
      - key: WEB_CONCURRENCY
        value: 1

      - key: GUNICORN_CMD_ARGS
        value: --timeout 120

      # ==========================================
      # PERFORMANCE
      # ==========================================
      - key: MALLOC_ARENA_MAX
        value: 2

      # ==========================================
      # LOGS
      # ==========================================
      - key: LOG_LEVEL
        value: INFO
```
