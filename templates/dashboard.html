<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Yamaha Bot</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#f5f6fa;
margin:0;
padding:0;
}

.header{
background:#0b3d91;
color:white;
padding:20px;
font-size:24px;
font-weight:bold;
}

.container{
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

.card h3{
margin:0;
font-size:14px;
color:#888;
}

.card h1{
margin:5px 0;
color:#0b3d91;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.chart{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 2px 8px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="header">
Dashboard Pós-Vendas Motoshow Yamaha
</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>Total Atendimentos</h3>
<h1>{{ total }}</h1>
</div>

<div class="card">
<h3>Agendamentos</h3>
<h1>{{ agendamentos }}</h1>
</div>

<div class="card">
<h3>Atendimento Humano</h3>
<h1>{{ humano }}</h1>
</div>

<div class="card">
<h3>Revisões</h3>
<h1>{{ revisao }}</h1>
</div>

</div>


<div class="grid">

<div class="chart">
<h3>Atendimentos por Setor</h3>
<canvas id="setorChart"></canvas>
</div>

<div class="chart">
<h3>Origem dos Leads</h3>
<canvas id="origemChart"></canvas>
</div>

</div>


<div class="grid" style="margin-top:20px;">

<div class="chart">
<h3>Revisões Mais Solicitadas</h3>
<canvas id="revisaoChart"></canvas>
</div>

<div class="chart">
<h3>Itens Adicionais</h3>
<canvas id="itensChart"></canvas>
</div>

</div>


</div>

<script>

const setorChart = new Chart(document.getElementById('setorChart'), {
type: 'bar',
data: {
labels: ['Revisão','Peças','Acessórios','Garantia','Logista'],
datasets: [{
label: 'Atendimentos',
data: [
{{ revisao }},
{{ pecas }},
{{ acessorios }},
{{ garantia }},
{{ logista }}
],
backgroundColor:[
'#0b3d91',
'#1976d2',
'#42a5f5',
'#64b5f6',
'#90caf9'
]
}]
}
});


const origemChart = new Chart(document.getElementById('origemChart'), {
type:'pie',
data:{
labels:['Campanha','Menu'],
datasets:[{
data:[
{{ campanha }},
{{ menu }}
],
backgroundColor:[
'#0b3d91',
'#42a5f5'
]
}]
}
});


const revisaoChart = new Chart(document.getElementById('revisaoChart'), {
type:'bar',
data:{
labels:['1ª','2ª','3ª','4ª','5ª+'],
datasets:[{
data:[
{{ r1 }},
{{ r2 }},
{{ r3 }},
{{ r4 }},
{{ r5 }}
],
backgroundColor:'#0b3d91'
}]
}
});


const itensChart = new Chart(document.getElementById('itensChart'), {
type:'bar',
data:{
labels:[
'Protetor',
'Slider',
'Suporte',
'Baú',
'Filtro',
'Pastilha'
],
datasets:[{
data:[
{{ protetor }},
{{ slider }},
{{ suporte }},
{{ bau }},
{{ filtro }},
{{ pastilha }}
],
backgroundColor:'#1976d2'
}]
}
});

</script>

</body>
</html>
